<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>桌面歌词</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        position: relative;
        display: grid;
        place-items: center;
        padding: 6px 48px;
        color: #f7f9fc;
        background: transparent;
        user-select: none;
        font-family: "HarmonyOS Sans SC", "Microsoft YaHei UI", sans-serif;
        -webkit-app-region: drag;
      }
      .locked, button { -webkit-app-region: no-drag; }
      strong {
        max-width: 100%;
        text-align: center;
        font-size: 24px;
        line-height: 1.3;
        text-shadow: 0 1px 2px #10141a, 0 0 4px #10141a;
        overflow: hidden;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      button {
        opacity: 0;
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 6px;
        color: rgb(240 245 251 / 78%);
        background: transparent;
      }
      body:hover button, body[data-pointer-inside] button, button:focus-visible { opacity: 1; }
      body.locked button { display: none; }
      button:hover, button[aria-pressed="true"] { background: rgb(255 255 255 / 10%); color: white; }
      button:focus-visible { outline: 2px solid #9bd6ff; }
      button svg { width: 16px; height: 16px; }
      .closed-shackle, .locked .open-shackle { display: none; }
      .locked .closed-shackle { display: inline; }
      @media (forced-colors: active) { body { forced-color-adjust: none; color: CanvasText; } strong { text-shadow: 0 0 3px Canvas; } }
    </style>
  </head>
  <body>
    <strong></strong>
    <button type="button" aria-pressed="false" aria-label="锁定" title="锁定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5" y="10" width="14" height="11" rx="2.5" />
        <path class="open-shackle" d="M8 10V7a4 4 0 0 1 7.8-1.3" />
        <path class="closed-shackle" d="M8 10V7a4 4 0 0 1 8 0v3" />
        <path d="M12 14v3" />
      </svg>
    </button>
  </body>
</html>
