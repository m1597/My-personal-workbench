name: Publish FitBay installers
on:
  push:
    branches:
      [
        "codex/release-0.2.1",
        "codex/desktop-shortcut-candidate",
        "codex/preview-0.2.3",
        "codex/release-0.2.4",
        "codex/preview-0.2.5",
        "codex/resume-1127-candidate",
        "codex/preview-0.2.6",
      ]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          if ($pkg.version -notmatch '^\d+\.\d+\.\d+$' -or ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$($pkg.version)")) { throw 'Release tag must match package.json version' }
          npx --yes --package=$($pkg.packageManager) npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run dist:win
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test tests/product-updates.test.mjs
      - name: Verify upgrade from the previous stable Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $oldTag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          if ($LASTEXITCODE) { throw 'Could not identify the upgrade baseline' }
          $previous = $oldTag.TrimStart('v')
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $baseline = Join-Path $env:RUNNER_TEMP 'fitbay-baseline'
          gh release download $oldTag --repo $env:GITHUB_REPOSITORY --dir $baseline --pattern 'FitBay-*-Setup-*-x64.exe' --pattern 'SHA256SUMS.txt'
          if ($LASTEXITCODE) { throw 'Could not download previous installers' }
          foreach ($component in 'Workbench','Music','Prompts','Toolkit') {
            $name = "FitBay-$component-Setup-$previous-x64.exe"
            $hash = (Get-FileHash -LiteralPath (Join-Path $baseline $name)).Hash.ToLowerInvariant()
            if ("$hash  $name" -notin (Get-Content (Join-Path $baseline 'SHA256SUMS.txt'))) { throw "Baseline hash mismatch: $name" }
          }
          $legacyComponents = Join-Path $env:RUNNER_TEMP 'fitbay-components-021'
          gh release download v0.2.1 --repo $env:GITHUB_REPOSITORY --dir $legacyComponents --pattern 'FitBay-Toolkit-Setup-*.exe' --pattern 'FitBay-Prompts-Setup-*.exe' --pattern 'SHA256SUMS.txt'
          if ($LASTEXITCODE) { throw 'Could not download mixed-version baseline' }
          foreach ($name in 'FitBay-Toolkit-Setup-0.2.1-x64.exe','FitBay-Prompts-Setup-0.2.1-x64.exe') {
            $hash = (Get-FileHash -LiteralPath (Join-Path $legacyComponents $name)).Hash.ToLowerInvariant()
            if ("$hash  $name" -notin (Get-Content (Join-Path $legacyComponents 'SHA256SUMS.txt'))) { throw "Legacy hash mismatch: $name" }
          }
          ./scripts/check-suite-installation.ps1 -BaselineDir $baseline -Previous $previous -LegacyDir $legacyComponents
          $root = Join-Path $env:RUNNER_TEMP 'Host only'
          ./scripts/check-host-only.ps1 -Installer "dist/installers/FitBay-Workbench-Setup-$version-x64.exe" -Root $root
          node scripts/check-settings-installation.mjs $root --candidate --remove
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/check-upgrade-data.mjs verify-removed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $registry = 'HKCU:\Software\FitBay\Installations'
          foreach ($product in 'Music','Prompts','Toolkit') {
            if ((Get-ItemProperty $registry).$product) { throw "Uninstall left $product registered" }
            $installer = if ($product -eq 'Toolkit') { Join-Path $legacyComponents 'FitBay-Toolkit-Setup-0.2.1-x64.exe' } else { Join-Path $baseline "FitBay-$product-Setup-$previous-x64.exe" }
            $process = Start-Process $installer -ArgumentList '/S /currentuser' -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -or (Get-ItemPropertyValue $registry $product) -ne (Join-Path $root $product)) { throw "Could not restore baseline $product" }
          }
          $history = 'HKCU:\Software\FitBay\PreviousInstallations'
          Remove-ItemProperty -LiteralPath $history -Name Prompts
          $retained = Join-Path $root 'Prompts/resources/my-retained-note.txt'
          Set-Content -LiteralPath $retained -Value 'legacy note'
          node scripts/check-settings-installation.mjs $root --candidate --legacy-reinstall $previous
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-Content -LiteralPath $retained) -ne 'legacy note') { throw 'Previous uninstaller lost the note' }
          Remove-Item -LiteralPath $retained
          # The old installer requires an empty destination. Remove only the empty
          # resources folder that contained the acceptance fixture.
          [IO.Directory]::Delete((Split-Path -Parent $retained))
          $installer = Join-Path $legacyComponents 'FitBay-Prompts-Setup-0.2.1-x64.exe'
          $process = Start-Process $installer -ArgumentList '/S /currentuser' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode) { throw 'Could not restore previous Prompts for batch upgrade' }
          # The previous public host has no batch UI. Keep the candidate host code and
          # seed its installed version marker so its own real installer is also offered.
          $hostMetadata = Join-Path $root 'resources/app/package.json'
          $hostPackage = Get-Content -Raw -LiteralPath $hostMetadata | ConvertFrom-Json
          $hostPackage.version = $previous
          [IO.File]::WriteAllText($hostMetadata, ($hostPackage | ConvertTo-Json -Depth 100))
          node scripts/check-settings-installation.mjs $root --candidate --batch $previous
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/check-upgrade-data.mjs verify (Join-Path $root 'Music')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $desktop = [Environment]::GetFolderPath('DesktopDirectory')
          $folder = (New-Object -ComObject Shell.Application).NameSpace($desktop)
          $links = @(Get-ChildItem -LiteralPath $desktop -Filter '*.lnk' | ForEach-Object {
            $target = $folder.ParseName($_.Name).ExtendedProperty('System.Link.TargetParsingPath')
            if ($target -and $target.StartsWith($root + '\', [StringComparison]::OrdinalIgnoreCase)) { $target }
          })
          if ($links.Count -ne 1 -or $links[0] -ne (Join-Path $root 'FitBay.exe')) { throw "Unexpected FitBay desktop links after batch: $links" }
          node scripts/check-installed-component-material.mjs $root
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/check-prompt-visual-package.mjs $root
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/check-installed-toolkit-renderer.mjs $root
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $catalog = Get-Content -Raw (Join-Path $root 'Music/resources/app/host/plugin-catalog.json') | ConvertFrom-Json
          foreach ($id in 'wave','tags','rules') {
            $entry = @($catalog | Where-Object id -eq $id)
            $url = "https://github.com/m1597/My-personal-workbench/releases/download/music-v1.0.0/$id.fitbayplugin"
            if ($entry.Count -ne 1 -or $entry[0].url -cne $url) { throw "Incorrect installed plugin URL: $id" }
            $file = Join-Path $env:RUNNER_TEMP "$id.fitbayplugin"
            Invoke-WebRequest -Uri $url -OutFile $file
            if ((Get-Item $file).Length -ne $entry[0].bytes -or (Get-FileHash $file).Hash -ne $entry[0].digest) { throw "Incorrect plugin bytes: $id" }
            Write-Host "PASS installed catalog fetched and verified $id from the main repository"
          }
          Copy-Item "docs/releases/v$version.md" dist/installers/RELEASE-NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installers
          path: |
            dist/installers/*.exe
            dist/installers/*.fitbayplugin
            dist/installers/SHA256SUMS.txt
            dist/installers/RELEASE-NOTES.md
          if-no-files-found: error
  verify-distributed-upgrade:
    if: github.ref == 'refs/heads/codex/preview-0.2.6'
    needs: build
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: dist/installers
      - name: Update all four products from the distributed 0.2.5 installation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          npx --yes --package=$($pkg.packageManager) npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $baseline = Join-Path $env:RUNNER_TEMP 'distributed-025'
          gh run download 45940364526 --name installers --dir $baseline
          if ($LASTEXITCODE) { throw 'Could not download the frozen 0.2.5 installers' }
          $setup = Join-Path $baseline 'FitBay-Offline-Setup-0.2.5-x64.exe'
          if ((Get-FileHash $setup).Hash -ne '1c9714a2e1824db71814628dc0a2b91c6eaac2821a4d243fa2f80352c523c9d7') { throw 'Incorrect baseline installer' }
          $root = Join-Path $env:RUNNER_TEMP 'Distributed FitBay'
          $process = Start-Process $setup -ArgumentList "/S /WITHMUSIC /WITHPROMPTS /WITHTOOLKIT /D=$root" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode) { throw 'Could not install baseline' }
          node scripts/check-settings-installation.mjs $root --candidate --batch 0.2.5 --uniform
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers
      - working-directory: installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file RELEASE-NOTES.md ./*.exe ./*.fitbayplugin SHA256SUMS.txt
  verify-live:
    needs: publish
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          npx --yes --package=$($pkg.packageManager) npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $asset = "FitBay-Workbench-Setup-$($pkg.version)-x64.exe"
          $downloads = Join-Path $env:RUNNER_TEMP 'host-download'
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --dir $downloads --pattern $asset
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $root = Join-Path $env:RUNNER_TEMP 'FitBay live'
          ./scripts/check-host-only.ps1 -Installer (Join-Path $downloads $asset) -Root $root
          node scripts/check-settings-installation.mjs $root
