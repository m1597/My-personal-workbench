appId: io.github.m1597.personalworkbench
productName: personal-workbench
directories:
  app: .cache/package-app
  output: dist
electronDist: node_modules/electron/dist
npmRebuild: false
asar: true
files:
  - out/**/*
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.txt
  - "!node_modules/**/*"
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/app.ico
  artifactName: Personal-Workbench-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 个人工作台
  uninstallDisplayName: 个人工作台
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  installerLanguages: [zh_CN, en_US]
  language: "2052"
